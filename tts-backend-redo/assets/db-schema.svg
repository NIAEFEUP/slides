<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Marker Arrow Blue -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    
    <!-- Marker Arrow Teal -->
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>

    <!-- Marker Arrow Indigo -->
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <style>
    .card { rx: 8px; fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5px; filter: url(#card-shadow); }
    .header-core { fill: #13212e; rx: 8px; }
    .header-audit { fill: #0f766e; rx: 8px; }
    .header-auth { fill: #4338ca; rx: 8px; }
    .header-config { fill: #c2410c; rx: 8px; }
    .title-text { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .badge-text { font-family: 'Poppins', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.5px; fill: #ffffff; }
    .field-name { font-family: 'Ubuntu Mono', monospace; font-size: 11.5px; fill: #1e293b; font-weight: 500; }
    .field-type { font-family: 'Ubuntu Mono', monospace; font-size: 10.5px; fill: #64748b; }
    .key-pk { font-family: 'Ubuntu Mono', monospace; font-size: 9px; font-weight: 700; fill: #2563eb; }
    .key-fk { font-family: 'Ubuntu Mono', monospace; font-size: 9px; font-weight: 700; fill: #7c3aed; }
    .row-line { stroke: #f1f5f9; stroke-width: 1px; }
    .connector { stroke-width: 2px; fill: none; stroke-linecap: round; }
    .cardinality { font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .legend-title { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
  </style>

  <!-- BACKGROUND SUBTLE PANEL -->
  <rect x="0" y="0" width="880" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ==================== TABLE 1: exchange_request ==================== -->
  <g transform="translate(25, 20)">
    <rect class="card" width="245" height="175"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 237 0 A 8 8 0 0 1 245 0 L 245 34 L 0 34 Z" class="header-core"/>
    <text x="14" y="22" class="title-text">exchange_request</text>
    <rect x="180" y="8" width="52" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="206" y="20.5" text-anchor="middle" class="badge-text">CORE</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">id</text>
    <text x="230" y="55" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="63" x2="235" y2="63" class="row-line"/>

    <text x="14" y="78" class="field-name" dx="22">kind</text>
    <text x="230" y="78" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="86" x2="235" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">status</text>
    <text x="230" y="101" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="109" x2="235" y2="109" class="row-line"/>

    <text x="14" y="124" class="key-fk">FK</text>
    <text x="36" y="124" class="field-name">period_id</text>
    <text x="230" y="124" text-anchor="end" class="field-type">Int?</text>
    <line x1="10" y1="132" x2="235" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">created_at</text>
    <text x="230" y="147" text-anchor="end" class="field-type">DateTime</text>
    <line x1="10" y1="155" x2="235" y2="155" class="row-line"/>

    <text x="14" y="167" class="field-name" dx="22">updated_at</text>
    <text x="230" y="167" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== TABLE 2: exchange_participant ==================== -->
  <g transform="translate(315, 20)">
    <rect class="card" width="250" height="175"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 242 0 A 8 8 0 0 1 250 0 L 250 34 L 0 34 Z" class="header-core"/>
    <text x="14" y="22" class="title-text">exchange_participant</text>
    <rect x="180" y="8" width="58" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="209" y="20.5" text-anchor="middle" class="badge-text">STUDENT</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">id</text>
    <text x="236" y="55" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="63" x2="240" y2="63" class="row-line"/>

    <text x="14" y="78" class="key-fk">FK</text>
    <text x="36" y="78" class="field-name">request_id</text>
    <text x="236" y="78" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="86" x2="240" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">student_nmec</text>
    <text x="236" y="101" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="109" x2="240" y2="109" class="row-line"/>

    <text x="14" y="124" class="field-name" dx="22">status</text>
    <text x="236" y="124" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="132" x2="240" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">confirmed_at</text>
    <text x="236" y="147" text-anchor="end" class="field-type">DateTime?</text>
    <line x1="10" y1="155" x2="240" y2="155" class="row-line"/>

    <text x="14" y="167" class="field-name" dx="22">created_at</text>
    <text x="236" y="167" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== TABLE 3: exchange_item ==================== -->
  <g transform="translate(610, 20)">
    <rect class="card" width="245" height="175"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 237 0 A 8 8 0 0 1 245 0 L 245 34 L 0 34 Z" class="header-core"/>
    <text x="14" y="22" class="title-text">exchange_item</text>
    <rect x="180" y="8" width="52" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="206" y="20.5" text-anchor="middle" class="badge-text">CLASSES</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">id</text>
    <text x="230" y="55" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="63" x2="235" y2="63" class="row-line"/>

    <text x="14" y="78" class="key-fk">FK</text>
    <text x="36" y="78" class="field-name">participant_id</text>
    <text x="230" y="78" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="86" x2="235" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">course_unit_id</text>
    <text x="230" y="101" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="109" x2="235" y2="109" class="row-line"/>

    <text x="14" y="124" class="field-name" dx="22">from_class_id</text>
    <text x="230" y="124" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="132" x2="235" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">to_class_id</text>
    <text x="230" y="147" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="155" x2="235" y2="155" class="row-line"/>

    <text x="14" y="167" class="field-name" dx="22">created_at</text>
    <text x="230" y="167" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== TABLE 4: exchange_event (Audit) ==================== -->
  <g transform="translate(25, 235)">
    <rect class="card" width="245" height="165"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 237 0 A 8 8 0 0 1 245 0 L 245 34 L 0 34 Z" class="header-audit"/>
    <text x="14" y="22" class="title-text">exchange_event</text>
    <rect x="165" y="8" width="68" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="199" y="20.5" text-anchor="middle" class="badge-text">AUDIT LOG</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">id</text>
    <text x="230" y="55" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="63" x2="235" y2="63" class="row-line"/>

    <text x="14" y="78" class="key-fk">FK</text>
    <text x="36" y="78" class="field-name">request_id</text>
    <text x="230" y="78" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="86" x2="235" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">event_name</text>
    <text x="230" y="101" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="109" x2="235" y2="109" class="row-line"/>

    <text x="14" y="124" class="field-name" dx="22">payload</text>
    <text x="230" y="124" text-anchor="end" class="field-type">Json</text>
    <line x1="10" y1="132" x2="235" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">created_at</text>
    <text x="230" y="147" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== TABLE 5: exchange_confirmation_token ==================== -->
  <g transform="translate(315, 235)">
    <rect class="card" width="250" height="165"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 242 0 A 8 8 0 0 1 250 0 L 250 34 L 0 34 Z" class="header-auth"/>
    <text x="14" y="22" class="title-text">confirmation_token</text>
    <rect x="175" y="8" width="62" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="206" y="20.5" text-anchor="middle" class="badge-text">SECURITY</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">token</text>
    <text x="236" y="55" text-anchor="end" class="field-type">UUID</text>
    <line x1="10" y1="63" x2="240" y2="63" class="row-line"/>

    <text x="14" y="78" class="key-fk">FK</text>
    <text x="36" y="78" class="field-name">participant_id</text>
    <text x="236" y="78" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="86" x2="240" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">expires_at</text>
    <text x="236" y="101" text-anchor="end" class="field-type">DateTime</text>
    <line x1="10" y1="109" x2="240" y2="109" class="row-line"/>

    <text x="14" y="124" class="field-name" dx="22">used_at</text>
    <text x="236" y="124" text-anchor="end" class="field-type">DateTime?</text>
    <line x1="10" y1="132" x2="240" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">created_at</text>
    <text x="236" y="147" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== TABLE 6: exchange_period ==================== -->
  <g transform="translate(610, 235)">
    <rect class="card" width="245" height="165"/>
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 237 0 A 8 8 0 0 1 245 0 L 245 34 L 0 34 Z" class="header-config"/>
    <text x="14" y="22" class="title-text">exchange_period</text>
    <rect x="175" y="8" width="58" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <text x="204" y="20.5" text-anchor="middle" class="badge-text">CONFIG</text>

    <!-- Fields -->
    <text x="14" y="55" class="key-pk">PK</text>
    <text x="36" y="55" class="field-name">id</text>
    <text x="230" y="55" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="63" x2="235" y2="63" class="row-line"/>

    <text x="14" y="78" class="field-name" dx="22">academic_year</text>
    <text x="230" y="78" text-anchor="end" class="field-type">String</text>
    <line x1="10" y1="86" x2="235" y2="86" class="row-line"/>

    <text x="14" y="101" class="field-name" dx="22">semester</text>
    <text x="230" y="101" text-anchor="end" class="field-type">Int</text>
    <line x1="10" y1="109" x2="235" y2="109" class="row-line"/>

    <text x="14" y="124" class="field-name" dx="22">start_date</text>
    <text x="230" y="124" text-anchor="end" class="field-type">DateTime</text>
    <line x1="10" y1="132" x2="235" y2="132" class="row-line"/>

    <text x="14" y="147" class="field-name" dx="22">end_date</text>
    <text x="230" y="147" text-anchor="end" class="field-type">DateTime</text>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- 1. Request -> Participant (1:N) -->
  <path d="M 270 95 L 307 95" class="connector" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="278" y="80" width="22" height="15" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="289" y="91" text-anchor="middle" class="cardinality" fill="#2563eb">1:N</text>

  <!-- 2. Participant -> Item (1:N) -->
  <path d="M 565 95 L 602 95" class="connector" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="573" y="80" width="22" height="15" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="584" y="91" text-anchor="middle" class="cardinality" fill="#2563eb">1:N</text>

  <!-- 3. Request -> Event (1:N vertical) -->
  <path d="M 147 195 L 147 227" class="connector" stroke="#0f766e" marker-end="url(#arrow-teal)"/>
  <rect x="153" y="202" width="22" height="15" rx="3" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="164" y="213" text-anchor="middle" class="cardinality" fill="#0f766e">1:N</text>

  <!-- 4. Participant -> Confirmation Token (1:1 vertical) -->
  <path d="M 440 195 L 440 227" class="connector" stroke="#4f46e5" marker-end="url(#arrow-indigo)"/>
  <rect x="446" y="202" width="22" height="15" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="457" y="213" text-anchor="middle" class="cardinality" fill="#4f46e5">1:1</text>
</svg>
